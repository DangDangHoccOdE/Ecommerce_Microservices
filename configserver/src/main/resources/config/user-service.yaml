spring:
  application:
    name: user-service
  mongodb:
    uri: ${DB_URL}
    database: ${DB_NAME}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
  jmx:
    enabled: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: "*"

  endpoint:
    prometheus:
      enabled: true

  metrics:
    export:
      prometheus:
        enabled: true

  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.ecommerce.user: TRACE
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 5MB
      max-history: 7 # 7 days of logs

# Keycloak Admin Client Configuration
keycloak:
  admin:
    username: user
    password: user
    client-id: admin-cli
    server-url: http://127.0.0.1:8444
    realm: ecom-app
    client-uid-id: c859d80a-de1e-480f-ab2e-c6126e688a4c
    # UID oauth2-pkce
