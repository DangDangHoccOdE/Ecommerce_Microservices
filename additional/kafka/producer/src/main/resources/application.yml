spring:
  application:
    name: producer
  cloud:
    function:
      definition: sendRiderLocation;sendRiderStatus
    stream:
      function:
        definition: sendRiderLocation;sendRiderStatus
      bindings:
        sendRiderLocation-out-0:
          # destination: my-topic-new
          destination: my-new-topic
          content-type: application/json
          producer:
            partition-key-expression: payload.riderId
            partition-count: 3
        sendRiderStatus-out-0:
          destination: new-topic
          content-type: text/plain
      # poller:
      #   fixed-delay: 5000
      kafka:
        binder:
          brokers: localhost:9092

